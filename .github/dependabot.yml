version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major version bumps frequently contain breaking changes, so ignore them
    # (e.g. openai 2.x -> 3.x) and handle them manually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Ignore major base-image bumps - handle them manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Python base image is pinned deliberately (matching the Dockerfile);
      # a 3.11 -> 3.14 tag change is a *minor* bump, so it needs an explicit rule.
      - dependency-name: "python"
