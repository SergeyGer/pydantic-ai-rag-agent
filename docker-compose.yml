services:
  qdrant:
    # Pinned to match qdrant-client (see requirements.txt) to avoid
    # client/server version-compatibility warnings.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget, so we speak HTTP over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3'''
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped

    # --- Hardening ---
    # Read-only root filesystem; a writable /tmp is provided via tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    # Never allow the process to gain extra privileges (e.g. via setuid binaries).
    security_opt:
      - no-new-privileges:true
    # --- /Hardening ---

    env_file:
      - .env
    environment:
      - API_PORT=8000
      # Container-side path; overrides any host-specific DATA_DIR from .env
      - DATA_DIR=/app/data
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      # Documents are only read at index time, so mount them read-only.
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    command: ["python", "-m", "src.api"]
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  qdrant_storage:
